<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aperçu - Login Screen</title>
<!-- Import des Ionicons -->
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

<style>
  /* Base */
  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
  }

  /* safeArea */
  .safeArea {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* background mis à jour avec Colors[theme].green (#15616d) */
  .background {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #15616d; 
    opacity: 0.8;
    z-index: 0;
  }

  /* Conteneur principal */
  .main-container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  /* topBar */
  .topBar {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    padding: 30px 20px 0 20px;
  }

  .logoContainer {
    display: flex;
    flex-direction: row;
    align-items: center;
  }

  /* Remplacement de l'Image Logo */
  .logoImage {
    width: 100px; 
    height: 40px;
    border-radius: 12px;
    background-color: #2d6a4f;
    object-fit: contain;
  }

  .langButton {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    cursor: pointer;
  }

  .langButtonText {
    color: #001524; 
    font-size: 15px;
    font-weight: 500;
    text-decoration: underline;
    text-decoration-color: #15616d; 
  }

  /* content */
  .content {
    padding: 20px;
    display: flex;
    flex-direction: column;
  }

  .title {
    font-size: 20px;
    font-weight: 700;
    align-self: center;
    color: #15616d; 
    margin-bottom: 15px;
  }

  .label {
    font-size: 14px;
    font-weight: 500;
    color: #000000; 
    margin-bottom: 6px;
    margin-top: 10px;
  }

  /* input : bordure mise à jour avec Colors[theme].tint (#78290f) */
  .input {
    background-color: #f9f9f9; 
    border: 2px solid #78290f; 
    border-radius: 5px;
    padding: 12px 14px;
    font-size: 15px;
    color: #000000; 
    width: 100%;
    outline: none;
  }

  .input::placeholder {
    color: #aaa; 
  }

  /* passwordContainer : bordure mise à jour avec Colors[theme].tint (#78290f) */
  .passwordContainer {
    display: flex;
    flex-direction: row;
    align-items: center;
    background-color: #f9f9f9; 
    border: 2px solid #78290f; 
    border-radius: 5px;
  }

  .passwordInput {
    flex: 1;
    padding: 12px 14px;
    font-size: 15px;
    color: #000000; 
    background-color: transparent;
    border: none;
    outline: none;
  }

  .passwordInput::placeholder {
    color: #aaa; 
  }

  .eyeButton {
    padding: 12px 12px;
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* loginButton : background mis à jour avec Colors[theme].tint (#78290f) */
  .loginButton {
    background-color: #78290f; 
    border-radius: 5px;
    padding: 12px 0;
    align-self: center;
    margin-top: 15px;
    width: 40%;
    border: none;
    cursor: pointer;
    display: flex;
    justify-content: center;
  }

  .loginButtonText {
    color: #ffffff; 
    font-size: 16px;
    font-weight: 600;
  }

  /* registerButton : largeur mise à jour à 40% */
  .registerButton {
    background-color: #ffecd1; 
    border-radius: 5px;
    padding: 12px 0;
    align-self: center;
    margin-top: 10px;
    width: 40%;
    border: 2px solid #15616d; 
    cursor: pointer;
    display: flex;
    justify-content: center;
  }

  .registerButtonText {
    color: #000000; 
    font-size: 16px;
    font-weight: 600;
  }

  /* footerLink pour mot de passe oublié */
  .footerLink {
    font-size: 15px;
    color: #001524; 
    font-weight: 600;
  }
  
  .footerLinkContaineroub {
    display: flex;
    flex-direction: row;
    align-self: center;
    gap: 6px;
    border-bottom: 2px solid #15616d; 
    max-width: 28%;
    margin-top: 20px;
    margin-bottom: 10px;
    cursor: pointer;
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="safeArea">
  <div class="background"></div>
  
  <div class="main-container">
    <div class="topBar">
      <div class="logoContainer">
        <div class="logoImage" style="display:flex; justify-content:center; align-items:center; color:white;">Logo</div>
      </div>
      <button class="langButton">
        <span class="langButtonText">Français</span>
      </button>
    </div>

    <div class="content">
      <div class="title">Bienvenue</div>
      
      <div class="label">Email</div>
      <input type="email" class="input" placeholder="Entrez votre email">
      
      <div class="label">Mot de passe</div>
      <div class="passwordContainer">
        <input type="password" class="passwordInput" placeholder="**********">
        <button class="eyeButton">
          <ion-icon name="eye-outline" style="font-size: 22px; color: #001524;"></ion-icon>
        </button>
      </div>

      <button class="loginButton">
        <span class="loginButtonText">Se connecter</span>
      </button>

      <button class="registerButton">
        <span class="registerButtonText">S'inscrire</span>
      </button>

    </div>
  </div>
</div>

</body>
</html>
